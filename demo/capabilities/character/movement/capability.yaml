# Capability Description
description: |
  Third-person character movement capability with finite state machine architecture.
  Extracted from Jeh3no/Godot-Third-Person-Controller and normalized for reuse.
  
  Features:
  - Smooth acceleration/deceleration
  - Slope traversal
  - Jump buffering and coyote time
  - Configurable multi-jump
  - Air control via curves
  - State machine for behavior management

# Architecture Notes
architecture_notes: |
  Uses CharacterBody3D as the base node type.
  Implements finite state machine pattern with states:
  - Idle: No movement input
  - Walk: Standard movement
  - Run: Faster movement (toggle or hold)
  - Jump: Active jump with air control
  - InAir: Airborne without jumping
  
  Each state has its own script for behavior management.
  Input is centralized in an input management component.

# Integration Guide
integration_guide: |
  1. Add capability to project
  2. Configure input map actions:
     - move_forward (W, Up)
     - move_backward (S, Down)
     - move_left (A, Left)
     - move_right (D, Right)
     - jump (Space)
     - run (Shift)
  3. Add CharacterBody3D node
  4. Attach movement script
  5. Configure movement parameters in inspector

